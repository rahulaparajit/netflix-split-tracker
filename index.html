<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e1362b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Netflix Split Tracker — Shared Subscription</title>
<meta name="apple-mobile-web-app-title" content="Netflix Split Tracker">
<link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --surface:#1b1917;
    --surface-2:#221f1c;
    --ink:#ede9e2;
    --ink-dim:#988f80;
    --accent:#e1362b;
    --accent-soft:rgba(225,54,43,.14);
    --gold:#d8a657;
    --gold-soft:rgba(216,166,87,.14);
    --line:#322d27;
    --radius:10px;
    --hatch-bg:#171412;
  }
  [data-theme="light"]{
    --bg:#f5f3ef;
    --surface:#ffffff;
    --surface-2:#eae6df;
    --ink:#1c1a17;
    --ink-dim:#6e6659;
    --accent:#d32f2f;
    --accent-soft:rgba(211,47,47,.1);
    --gold:#b58117;
    --gold-soft:rgba(181,129,23,.14);
    --line:#d6d0c4;
    --hatch-bg:#dbd5c9;
  }
  html, body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:780px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* ---- Header / Top bar ---- */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .cycle-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cycle-picker label{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  .cycle-select{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:6px;
    outline:none;
    cursor:pointer;
  }
  .cycle-select:focus{
    border-color:var(--gold);
  }

  /* ---- Header / stub ---- */
  .stub{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 28px 22px;
    position:relative;
    overflow:hidden;
  }
  .stub::before{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:0;
    border-top:2px dashed var(--line);
  }
  .stub-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:6px 12px;
  }
  .stub-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    margin:6px 0 2px;
  }
  .stub-meta{
    color:var(--gold);
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    margin-top:4px;
  }
  .stub-submeta{
    color:var(--ink-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    margin-top:2px;
  }
  .stub-total{
    margin-top:18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .stub-total .amount{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:40px;
    color:var(--accent);
  }
  .stub-total .label{color:var(--ink-dim);font-size:13px;}

  /* ---- Split bar (signature element) ---- */
  .split-bar{
    display:flex;
    height:34px;
    border-radius:6px;
    overflow:hidden;
    margin-top:20px;
    border:1px solid var(--line);
  }
  .split-seg{
    position:relative;
    border-right:1px solid var(--bg);
    min-width:2px;
    transition:filter .15s ease;
  }
  .split-seg:last-child{border-right:none;}
  .split-seg.unpaid{
    background-image:repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 6px, var(--hatch-bg) 6px, var(--hatch-bg) 12px);
  }
  .split-seg.paid{ background:var(--gold-soft); }
  .split-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    margin-top:12px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .split-legend span.dot{
    display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;
  }

  .cycle-status-badge{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    padding:4px 10px;
    border-radius:4px;
    letter-spacing:.06em;
    font-weight:700;
    text-transform:uppercase;
  }
  .cycle-status-badge.active{
    background:rgba(46,125,50,.18);
    color:#2e7d32;
    border:1px solid #388e3c;
  }
  [data-theme="dark"] .cycle-status-badge.active,
  :root:not([data-theme="light"]) .cycle-status-badge.active{
    background:rgba(126,201,143,.2);
    color:#7ec98f;
    border:1px solid #7ec98f;
  }
  .cycle-status-badge.future{
    background:rgba(21,101,192,.18);
    color:#1565c0;
    border:1px solid #1e88e5;
  }
  [data-theme="dark"] .cycle-status-badge.future,
  :root:not([data-theme="light"]) .cycle-status-badge.future{
    background:rgba(126,201,216,.2);
    color:#7ec9d8;
    border:1px solid #7ec9d8;
  }
  .cycle-status-badge.archived{
    background:var(--gold-soft);
    color:var(--gold);
    border:1px solid var(--gold);
  }

  /* ---- Section headers ---- */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:34px 0 12px;
  }
  .section-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0;
  }

  /* ---- Member ledger rows ---- */
  .ledger{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .row{
    display:grid;
    grid-template-columns:minmax(0, 1fr) auto auto;
    gap:14px;
    align-items:center;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row .name-col{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
  }
  .row .name{font-weight:500;}
  .row .paid-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
  }
  .row .amount{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    color:var(--ink);
    text-align:right;
    min-width:70px;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
    border:none;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .tag.paid{background:var(--gold-soft);color:var(--gold);}
  .tag.unpaid{background:var(--accent-soft);color:var(--accent);}
  .tag.disabled{background:var(--surface-2);color:var(--ink-dim);}
  
  .tag-btn{
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .tag-btn:hover{
    filter:brightness(1.2);
  }
  .tag-btn:active{
    transform:scale(0.96);
  }

  /* ---- Matrix table ---- */
  .matrix-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow-x:auto;
  }
  .matrix-table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
    font-size:13px;
  }
  .matrix-table th, .matrix-table td{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .matrix-table th{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.05em;
    background:var(--surface-2);
  }
  .matrix-table tr:last-child td{border-bottom:none;}
  .matrix-status{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
  }
  .matrix-status.ok{color:var(--gold);}
  .matrix-status.miss{color:var(--accent);}

  /* ---- Buttons ---- */
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    padding:9px 14px;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{border-color:#4a4238;}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
  button.primary:hover{background:#c72c22;}
  button.ghost{background:transparent;}
  button.danger{background:rgba(225,54,43,.15);border-color:var(--accent);color:var(--accent);}
  button.danger:hover{background:var(--accent);color:#fff;}
  button.small{padding:5px 10px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- Admin panel ---- */
  .admin-toggle{
    display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;flex-wrap:wrap;
  }
  .panel{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    padding:20px;
    margin-top:10px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.03em;
  }
  .field input, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .member-edit-row{
    display:grid;
    grid-template-columns:1fr 90px 75px 125px auto;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
  }
  .member-edit-row input, .member-edit-row select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:8px 9px;font-size:13px;width:100%;
  }
  .paid-date-link{
    background:none;
    border:none;
    padding:0;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--gold);
    text-decoration:underline;
    cursor:pointer;
  }
  .paid-date-link:hover{
    opacity:.8;
  }

  .registry-table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:13px;
  }
  .registry-table th, .registry-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    text-align:left;
  }
  .registry-table th{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
  }

  /* ---- Empty state styling ---- */
  .empty-state-box{
    text-align:center;
    padding:32px 20px;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    margin:10px 0;
  }
  .empty-state-box .empty-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
  }
  .empty-state-box .empty-desc{
    font-size:12.5px;
    color:var(--ink-dim);
    max-width:460px;
    margin:0 auto 16px;
    line-height:1.5;
  }
  .empty-state-box .empty-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .status-toast{
    position:fixed;
    bottom:20px;
    right:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:100;
    display:none;
    align-items:center;
    gap:8px;
  }
  .status-toast.ok{border-color:var(--gold);color:var(--gold);}
  .status-toast.err{border-color:var(--accent);color:var(--accent);}
  .status-toast.info{border-color:var(--ink-dim);color:var(--ink);}

  .status-msg{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 12px;
    border-radius:6px;
    margin-top:12px;
  }
  .status-msg.ok{background:var(--gold-soft);color:var(--gold);}
  .status-msg.err{background:var(--accent-soft);color:var(--accent);}
  .status-msg.info{background:var(--surface-2);color:var(--ink-dim);}

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:13px;
  }
  /* ---- Mobile PWA Install Banner ---- */
  .install-banner{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 24px);
    max-width:480px;
    box-sizing:border-box;
    background:var(--surface);
    border:1px solid var(--gold);
    border-radius:var(--radius);
    padding:12px 14px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    z-index:1000;
    animation:slideUp .3s ease;
  }
  @keyframes slideUp{
    from{transform:translate(-50%, 80px);opacity:0;}
    to{transform:translate(-50%, 0);opacity:1;}
  }
  .install-banner-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    width:100%;
    box-sizing:border-box;
  }
  .install-banner-text{
    flex:1 1 auto;
    min-width:0;
  }
  .install-banner-text strong{
    display:block;
    font-size:12.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .install-banner-text span{
    font-size:11px;
    color:var(--ink-dim);
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .install-banner-actions{
    display:flex;
    gap:6px;
    align-items:center;
    flex-shrink:0;
  }

  /* ---- Custom Modal Overlay & Dialog ---- */
  .modal-overlay{
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    z-index:2000;
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .modal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    width:100%;
    max-width:440px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
    overflow:hidden;
    animation:scaleUp .2s ease;
  }
  @keyframes scaleUp{
    from{transform:scale(0.95);opacity:0;}
    to{transform:scale(1);opacity:1;}
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 20px;
    border-bottom:1px solid var(--line);
    background:var(--surface-2);
  }
  .modal-header h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .modal-body{
    padding:20px;
  }
  .modal-desc{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 16px;
    line-height:1.45;
  }
  .modal-note{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    margin-top:14px;
    line-height:1.4;
  }
  .modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:14px 20px;
    background:var(--surface-2);
    border-top:1px solid var(--line);
  }
  .icon-only{
    padding:4px 8px;
    line-height:1;
  }

  @media (max-width:600px){
    .wrap{padding:14px 10px 60px; width:100%; box-sizing:border-box;}
    .top-bar{flex-direction:column;align-items:stretch;gap:10px; width:100%;}
    .admin-toggle{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); width:100%; gap:6px;}
    .admin-toggle button{text-align:center;justify-content:center;min-height:38px; width:100%; white-space:nowrap; padding:6px 8px; font-size:11.5px;}
    .cycle-picker{width:100%;justify-content:space-between; gap:6px;}
    .cycle-select{flex:1; width:100%; max-width:100%; min-height:38px; font-size:11.5px;}
    .stub{padding:18px 14px 16px; width:100%; box-sizing:border-box;}
    .stub-title{font-size:22px; word-break:break-word;}
    .stub-total .amount{font-size:32px;}
    .grid-2{grid-template-columns:1fr;}
    .member-edit-row{grid-template-columns:1fr 1fr;}
    .row{padding:12px 10px; gap:8px;}
    .install-banner{padding:10px 12px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="cycle-picker">
      <label for="cycleSelect">Billing Period:</label>
      <select id="cycleSelect" class="cycle-select">
        <option value="current">Current Cycle</option>
      </select>
    </div>

    <div class="admin-toggle">
      <button id="themeToggleBtn" class="small ghost" title="Toggle Light/Dark Theme">☀️ Light</button>
      <button id="registryBtn" class="small ghost" style="display:none;" title="Manage Master Registered Members">Member Registry</button>
      <button id="addPastCycleBtn" class="small ghost" style="display:none;" title="Create a new billing cycle (Active, Future, or Past)">+ Create Cycle</button>
      <button id="loginBtn" class="small">Admin login</button>
      <button id="logoutBtn" class="small ghost" style="display:none;">Log out</button>
    </div>
  </div>

  <div class="stub">
    <div class="stub-eyebrow">
      <span>Shared subscription · updated <span id="lastUpdated">—</span></span>
      <span id="cycleStatusBadge" class="cycle-status-badge active">ACTIVE CYCLE</span>
    </div>
    <div class="stub-title" id="planName">Loading…</div>
    <div class="stub-meta" id="planMeta"></div>
    <div class="stub-submeta" id="planSubMeta">Prepaid Plan · Billed 26th of every month</div>
    <div class="stub-total">
      <span class="amount" id="planTotal">—</span>
      <span class="label" id="planCurrency"></span>
    </div>
    <div class="split-bar" id="splitBar"></div>
    <div class="split-legend" id="splitLegend"></div>
  </div>

  <div class="panel" id="registryPanel" style="display:none;"></div>

  <div class="section-head">
    <h2 id="ledgerTitle">Members Ledger</h2>
    <button id="editBtn" class="small" style="display:none;">Edit Cycle</button>
  </div>
  <div class="ledger" id="memberLedger">
    <div class="empty">Loading member data…</div>
  </div>

  <div class="panel" id="editPanel" style="display:none;"></div>

  <div class="section-head" style="margin-top:36px;">
    <h2>Contribution Matrix</h2>
  </div>
  <div class="matrix-card" id="matrixCard">
    <div class="empty">Loading history matrix…</div>
  </div>


</div>

<div id="toast" class="status-toast"></div>

<div id="installBanner" class="install-banner" style="display:none;">
  <div class="install-banner-content">
    <div class="install-banner-text">
      <strong>Install Netflix Split Tracker</strong>
      <span>Add to home screen for instant mobile access</span>
    </div>
    <div class="install-banner-actions">
      <button id="installAppBtn" class="small primary">Install</button>
      <button id="dismissInstallBtn" class="small ghost">✕</button>
    </div>
  </div>
</div>

<div id="loginModal" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Login</h3>
      <button id="closeLoginModalBtn" class="small ghost icon-only" title="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:0;">
        <label for="adminTokenInput">GitHub Personal Access Token</label>
        <input type="password" id="adminTokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      </div>
      <div id="loginModalMsg" class="status-msg" style="display:none;margin-top:12px;"></div>
    </div>
    <div class="modal-footer">
      <button id="cancelLoginBtn" class="small ghost">Cancel</button>
      <button id="submitLoginBtn" class="small primary">Login</button>
    </div>

</div>

  <div class="modal-card">
    <div class="modal-header">
      <h3 id="customModalTitle">Modal Title</h3>

    </div>

      <button id="customModalCancelBtn" class="small ghost">Cancel</button>
      <button id="customModalConfirmBtn" class="small primary">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ======================= CONFIG ======================= *
 * Update these three values to point at YOUR repo before  *
 * deploying to GitHub Pages. Owner/repo/path are public,   *
 * so it's fine to have them visible in this file.          *
 * ======================================================= */
const CONFIG = {
  owner: "rahulaparajit",
  repo: "netflix-split-tracker",
  path: "data.json",
  branch: "main"
};
/* ======================================================= */

const API_BASE = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
const TOKEN_KEY = "planLedger_token";

let currentData = null;
let currentSha = null;
let selectedCycleId = "current";
let isEditing = false;
let isManagingRegistry = false;
let workingMembers = [];

const els = {
  cycleSelect: document.getElementById("cycleSelect"),
  lastUpdated: document.getElementById("lastUpdated"),
  cycleStatusBadge: document.getElementById("cycleStatusBadge"),
  planName: document.getElementById("planName"),
  planMeta: document.getElementById("planMeta"),
  planSubMeta: document.getElementById("planSubMeta"),
  planTotal: document.getElementById("planTotal"),
  planCurrency: document.getElementById("planCurrency"),
  splitBar: document.getElementById("splitBar"),
  splitLegend: document.getElementById("splitLegend"),
  memberLedger: document.getElementById("memberLedger"),
  matrixCard: document.getElementById("matrixCard"),
  loginBtn: document.getElementById("loginBtn"),
  logoutBtn: document.getElementById("logoutBtn"),
  addPastCycleBtn: document.getElementById("addPastCycleBtn"),
  registryBtn: document.getElementById("registryBtn"),
  editBtn: document.getElementById("editBtn"),
  editPanel: document.getElementById("editPanel"),
  registryPanel: document.getElementById("registryPanel"),
  themeToggleBtn: document.getElementById("themeToggleBtn"),
  installBanner: document.getElementById("installBanner"),
  installAppBtn: document.getElementById("installAppBtn"),
  dismissInstallBtn: document.getElementById("dismissInstallBtn"),
  loginModal: document.getElementById("loginModal"),
  closeLoginModalBtn: document.getElementById("closeLoginModalBtn"),
  adminTokenInput: document.getElementById("adminTokenInput"),
  loginModalMsg: document.getElementById("loginModalMsg"),
  cancelLoginBtn: document.getElementById("cancelLoginBtn"),
  submitLoginBtn: document.getElementById("submitLoginBtn"),
  toast: document.getElementById("toast")
};

const SEG_COLORS = ["#e1362b","#d8a657","#7e9cd8","#7ec98f","#c98fd8","#d8c47e","#8fd8c9","#d87e9c"];
const THEME_KEY = "planLedger_theme";

// Register Service Worker for PWA compliance
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// Handle Mobile Browser PWA Install Prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (els.installBanner) els.installBanner.style.display = "block";
});

if (els.installAppBtn) {
  els.installAppBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (els.installBanner) els.installBanner.style.display = "none";
    } else {
      await showCustomAlert("Install on iOS Safari", "1. Tap the Share icon in Safari (square with upward arrow)\n2. Select 'Add to Home Screen'");
    }
  });
}

if (els.dismissInstallBtn) {
  els.dismissInstallBtn.addEventListener('click', () => {
    if (els.installBanner) els.installBanner.style.display = "none";
  });
}

function getTheme(){ return localStorage.getItem(THEME_KEY) || "light"; }
function setTheme(t){
  localStorage.setItem(THEME_KEY, t);
  document.documentElement.setAttribute("data-theme", t);
  if(els.themeToggleBtn){
    els.themeToggleBtn.textContent = t === "light" ? "🌙 Dark" : "☀️ Light";
  }
}

// Initial theme setup
setTheme(getTheme());

if(els.themeToggleBtn){
  els.themeToggleBtn.addEventListener("click", () => {
    const current = getTheme();
    setTheme(current === "light" ? "dark" : "light");
  });
}

function setToken(t){
  if(!t) return;
  const val = t.trim();
  const isHttps = window.location.protocol === 'https:';
  const secureFlag = isHttps ? '; Secure' : '';
  document.cookie = `${TOKEN_KEY}=${encodeURIComponent(val)}; path=/; max-age=2592000; SameSite=Strict${secureFlag}`;
  try { localStorage.setItem(TOKEN_KEY, val); } catch(e) {}
}

function getToken(){
  const name = TOKEN_KEY + "=";
  const decodedCookie = decodeURIComponent(document.cookie || "");
  const ca = decodedCookie.split(';');
  for(let i = 0; i < ca.length; i++) {
    let c = ca[i].trim();
    if (c.indexOf(name) === 0) {
      const val = c.substring(name.length, c.length);
      if(val) return val;
    }
  }
  try { return localStorage.getItem(TOKEN_KEY); } catch(e) { return null; }
}

function clearToken(){
  document.cookie = `${TOKEN_KEY}=; path=/; max-age=0; SameSite=Strict`;
  try { localStorage.removeItem(TOKEN_KEY); } catch(e) {}
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (match, p1) => String.fromCharCode(parseInt(p1, 16))));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split("").map(c =>
    "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}

function fmtMoney(n, currency){
  const num = Number(n || 0);
  return `${currency || ""}${num.toLocaleString(undefined,{maximumFractionDigits:2})}`;
}

function fmtDate(isoStr){
  if(!isoStr) return "";
  try{
    const d = new Date(isoStr);
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }catch(e){ return ""; }
}

function getCycleDurationInfo(billingDateStr){
  let bDate;
  if(billingDateStr){
    const parts = billingDateStr.split('-');
    if(parts.length === 3){
      bDate = new Date(Number(parts[0]), Number(parts[1]) - 1, 26);
    } else {
      bDate = new Date(billingDateStr);
      bDate.setDate(26);
    }
  } else {
    bDate = new Date();
    bDate.setDate(26);
  }

  const endDate = new Date(bDate.getFullYear(), bDate.getMonth(), 26);
  const startDate = new Date(bDate.getFullYear(), bDate.getMonth() - 1, 27);

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const startFormatted = `27th ${months[startDate.getMonth()]}`;
  const endFormatted = `26th ${months[endDate.getMonth()]} ${endDate.getFullYear()}`;
  const shortRange = `${months[startDate.getMonth()]} 27 – ${months[endDate.getMonth()]} 26`;

  return {
    billingDateIso: endDate.toISOString().split("T")[0],
    startDate,
    endDate,
    label: `${startFormatted} – ${endFormatted}`,
    shortLabel: shortRange
  };
}

function showToast(msg, type="info", duration=3000){
  els.toast.className = `status-toast ${type}`;
  els.toast.textContent = msg;
  els.toast.style.display = "flex";
  if(duration > 0){
    setTimeout(() => {
      els.toast.style.display = "none";
    }, duration);
  }
}

async function loadData(){
  els.memberLedger.innerHTML = `<div class="empty">Loading member data…</div>`;
  const token = getToken();
  if(token){
    validateToken(token).then(isValid => {
      if(!isValid){
        clearToken();
        updateAdminUI();
        render();
      }
    });
  }
  try{
    const headers = {"Accept":"application/vnd.github+json"};
    if(token) headers["Authorization"] = `Bearer ${token}`;
    const res = await fetch(`${API_BASE}?ref=${CONFIG.branch}&_=${Date.now()}`, {headers});
    if(!res.ok){
      if(res.status === 404){
        renderEmptyState();
        return;
      }
      throw new Error(`GitHub API error: ${res.status}`);
    }
    const json = await res.json();
    currentSha = json.sha;
    currentData = JSON.parse(b64DecodeUnicode(json.content.replace(/\n/g,"")));
    
    if(!currentData.members) currentData.members = [];
    if(!currentData.history) currentData.history = [];
    if(!currentData.registeredMembers) currentData.registeredMembers = [];
    
    // Auto-sync initial registered members if missing
    if(currentData.registeredMembers.length === 0 && currentData.members.length > 0){
      currentData.registeredMembers = currentData.members.map(m => ({
        id: m.id || ('m-' + Date.now() + Math.random().toString(36).substring(2,5)),
        name: m.name,
        active: true,
        joinedAt: new Date().toISOString()
      }));
    }
    
    if(currentData.plan && currentData.plan.billingDate){
      const parts = currentData.plan.billingDate.split('-');
      if(parts.length === 3 && parts[2] !== '26'){
        currentData.plan.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
    }
    
    populateCycleSelector();
    render();
  }catch(err){
    els.memberLedger.innerHTML = `<div class="empty">Couldn't load data.json — ${err.message}</div>`;
  }
}

function renderEmptyState(){
  currentData = {
    plan:{name:"Netflix Premium", totalCost:649, currency:"₹", billingDate:"2026-08-26", notes:"Prepaid plan · Billed on 26th of every month"},
    registeredMembers:[],
    members:[],
    history:[],
    lastUpdated:null
  };
  currentSha = null;
  populateCycleSelector();
  render();
}

function populateCycleSelector(){
  els.cycleSelect.innerHTML = "";

  const currInfo = getCycleDurationInfo(currentData.plan.billingDate);
  const currStatus = (currentData.plan && currentData.plan.status) ? currentData.plan.status : "active";
  const currTag = currStatus === "active" ? "[ACTIVE]" : currStatus === "future" ? "[FUTURE]" : "[ARCHIVED]";

  const currOpt = document.createElement("option");
  currOpt.value = "current";
  currOpt.textContent = `Current Cycle (${currInfo.label}) ${currTag}`;
  els.cycleSelect.appendChild(currOpt);

  if(currentData && currentData.history){
    currentData.history.forEach(h => {
      const opt = document.createElement("option");
      opt.value = h.id;
      const hInfo = getCycleDurationInfo(h.billingDate);
      const hStatus = h.status || "archived";
      const hTag = hStatus === "active" ? "[ACTIVE]" : hStatus === "future" ? "[FUTURE]" : "[ARCHIVED]";
      opt.textContent = `${h.cycleLabel || hInfo.label} ${hTag}`;
      els.cycleSelect.appendChild(opt);
    });
  }
  els.cycleSelect.value = selectedCycleId;
}

els.cycleSelect.addEventListener("change", (e) => {
  selectedCycleId = e.target.value;
  if(isEditing){
    isEditing = false;
    els.editPanel.style.display = "none";
    els.editBtn.textContent = "Edit Cycle";
  }
  updateAdminUI();
  render();
});

function getActiveCycleData(){
  if(!currentData) return { plan:{}, members:[], status:'active' };
  if(selectedCycleId === "current"){
    return {
      plan: currentData.plan,
      members: currentData.members || [],
      isArchive: false,
      status: (currentData.plan && currentData.plan.status) ? currentData.plan.status : 'active'
    };
  }
  const hist = (currentData.history || []).find(h => h.id === selectedCycleId);
  if(hist){
    return {
      plan: {
        name: currentData.plan.name,
        totalCost: hist.totalCost || currentData.plan.totalCost,
        currency: hist.currency || currentData.plan.currency,
        billingDate: hist.billingDate,
        notes: currentData.plan.notes
      },
      members: hist.members || [],
      isArchive: true,
      cycleLabel: hist.cycleLabel,
      status: hist.status || 'archived',
      histObject: hist
    };
  }
  return { plan: currentData.plan, members: currentData.members || [], isArchive: false, status: 'active' };
}

function render(){
  const cycleData = getActiveCycleData();
  const {plan, members, isArchive, cycleLabel, status} = cycleData;

  const durationInfo = getCycleDurationInfo(plan.billingDate);

  els.planName.textContent = plan.name || "Untitled plan";
  els.planMeta.textContent = `Cycle Duration · ${cycleLabel || durationInfo.label}`;
  els.planSubMeta.textContent = `Prepaid Plan · Billed on 26th (${durationInfo.billingDateIso})`;
  els.planTotal.textContent = fmtMoney(plan.totalCost, plan.currency);
  els.planCurrency.textContent = "total / cycle";
  els.lastUpdated.textContent = currentData.lastUpdated ? new Date(currentData.lastUpdated).toLocaleDateString() : "never";

  const activeStatus = status || (isArchive ? 'archived' : 'active');
  els.cycleStatusBadge.className = `cycle-status-badge ${activeStatus}`;
  if(activeStatus === 'active'){
    els.cycleStatusBadge.textContent = 'ACTIVE CYCLE';
  } else if(activeStatus === 'future'){
    els.cycleStatusBadge.textContent = 'FUTURE CYCLE (ADVANCE)';
  } else {
    els.cycleStatusBadge.textContent = `ARCHIVED · ${cycleLabel || durationInfo.shortLabel}`;
  }

  renderSplitBar(plan, members);
  renderLedger(members, plan.currency, isArchive);
  renderMatrix();

  if(isEditing) renderEditPanel();
  if(isManagingRegistry) renderRegistryPanel();
}

function renderSplitBar(plan, members){
  els.splitBar.innerHTML = "";
  els.splitLegend.innerHTML = "";
  
  if(!members || members.length === 0){
    els.splitBar.style.display = "none";
    els.splitLegend.innerHTML = `<span style="color:var(--ink-dim);font-style:italic;">No members in cycle — split bar hidden</span>`;
    return;
  }

  const total = members.reduce((s,m) => s + Number(m.share || 0), 0) || 1;
  members.forEach((m, i) => {
    const pct = (Number(m.share || 0) / total) * 100;
    const color = SEG_COLORS[i % SEG_COLORS.length];
    const seg = document.createElement("div");
    seg.className = `split-seg ${m.paid ? "paid" : "unpaid"}`;
    seg.style.width = `${pct}%`;
    if(m.paid) seg.style.background = color;
    seg.title = `${m.name}: ${fmtMoney(m.share, plan.currency)} (${m.paid ? "paid" : "unpaid"})`;
    els.splitBar.appendChild(seg);

    const legendItem = document.createElement("div");
    legendItem.innerHTML = `<span class="dot" style="background:${m.paid ? color : 'transparent'};border:1px solid ${color};"></span>${m.name} · ${fmtMoney(m.share, plan.currency)}`;
    els.splitLegend.appendChild(legendItem);
  });
  els.splitBar.style.display = "flex";
}

function renderLedger(members, currency, isArchive){
  const loggedIn = !!getToken();
  
  if(!members || members.length === 0){
    let emptyActionHtml = '';
    if(loggedIn){
      emptyActionHtml = `
        <div class="empty-actions">
          <button id="ledgerEmptyRegBtn" class="primary small">Open Member Registry</button>
          <button id="ledgerEmptyEditBtn" class="ghost small">Edit Cycle Members</button>
        </div>
      `;
    }
    
    els.memberLedger.innerHTML = `
      <div class="empty-state-box">
        <div class="empty-title">No members in this cycle</div>
        <div class="empty-desc">
          ${loggedIn 
            ? "There are no members assigned to this billing period yet. Register new members or add registered members to start tracking." 
            : "The administrator has not added any members to this cycle yet."}
        </div>
        ${emptyActionHtml}
      </div>
    `;

    if(loggedIn){
      const regBtn = document.getElementById("ledgerEmptyRegBtn");
      const editBtn = document.getElementById("ledgerEmptyEditBtn");
      if(regBtn){
        regBtn.addEventListener("click", () => {
          isManagingRegistry = true;
          els.registryPanel.style.display = "block";
          els.registryBtn.textContent = "Close Registry";
          renderRegistryPanel();
        });
      }
      if(editBtn){
        editBtn.addEventListener("click", () => {
          isEditing = true;
          els.editPanel.style.display = "block";
          els.editBtn.textContent = "Close Editor";
          renderEditPanel();
        });
      }
    }
    return;
  }

  els.memberLedger.innerHTML = "";
  
  members.forEach(m => {
    const row = document.createElement("div");
    row.className = "row";
    
    const paidAtFormatted = m.paid && m.paidAt ? fmtDate(m.paidAt) : '';
    let paidDateHtml = '';

    if(loggedIn && m.paid){
      paidDateHtml = `<button class="paid-date-link" data-set-date-id="${m.id}" title="Click to change payment date">Paid ${paidAtFormatted || 'date'} ✏️</button>`;
    } else if(paidAtFormatted){
      paidDateHtml = `<div class="paid-date">Paid ${paidAtFormatted}</div>`;
    }
    
    let tagHtml = `<span class="tag ${m.paid ? "paid" : "unpaid"}">${m.paid ? "Paid ✓" : "Unpaid"}</span>`;
    
    if(loggedIn){
      tagHtml = `<div style="display:flex;gap:6px;align-items:center;">
        <button class="tag tag-btn ${m.paid ? "paid" : "unpaid"}" data-toggle-id="${m.id}">
          ${m.paid ? "Paid ✓" : "Mark Paid"}
        </button>
        ${m.paid ? `<button class="small ghost icon-only" data-set-date-id="${m.id}" title="Set Paid Date">📅</button>` : ''}
      </div>`;
    }

    row.innerHTML = `
      <div class="name-col">
        <div class="name">${escapeHtml(m.name)}</div>
        ${paidDateHtml ? `<div>${paidDateHtml}</div>` : ''}
      </div>
      <div class="amount">${fmtMoney(m.share, currency)}</div>
      <div>${tagHtml}</div>
    `;
    els.memberLedger.appendChild(row);
  });

  if(loggedIn){
    els.memberLedger.querySelectorAll("[data-toggle-id]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const id = e.currentTarget.dataset.toggleId;
        let targetMembers = isArchive ? getActiveCycleData().members : currentData.members;
        const targetMember = targetMembers.find(m => m.id === id);
        if(targetMember){
          targetMember.paid = !targetMember.paid;
          targetMember.paidAt = targetMember.paid ? (targetMember.paidAt || new Date().toISOString()) : null;
          render();
          showToast("Saving status...", "info");
          await saveChanges(true);
        }
      });
    });

    els.memberLedger.querySelectorAll("[data-set-date-id]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const id = e.currentTarget.dataset.setDateId;
        let targetMembers = isArchive ? getActiveCycleData().members : currentData.members;
        const targetMember = targetMembers.find(m => m.id === id);
        if(!targetMember) return;

        const currentIso = targetMember.paidAt ? targetMember.paidAt.split('T')[0] : new Date().toISOString().split('T')[0];

        const res = await openCustomModal({
          title: `Set Payment Date — ${targetMember.name}`,
          bodyHtml: `
            <div class="field" style="margin-bottom:0;">
              <label for="customPaidDateInput">Payment Date</label>
              <input type="date" id="customPaidDateInput" name="paidDate" value="${currentIso}">
            </div>
          `,
          confirmText: "Save Date",
          cancelText: "Cancel"
        });

        const selectedDate = typeof res === "string" ? res : (res ? (res.paidDate || res.value || res.customPaidDateInput) : null);
        if(!selectedDate) return;

        targetMember.paid = true;
        targetMember.paidAt = new Date(selectedDate + "T12:00:00.000Z").toISOString();

        const wm = workingMembers.find(m => m.id === id);
        if(wm){
          wm.paid = true;
          wm.paidAt = targetMember.paidAt;
        }

        render();
        showToast("Saving payment date...", "info");
        await saveChanges(true);
      });
    });
  }
}

function renderMatrix(){
  if(!currentData) return;
  const history = currentData.history || [];
  const currentMembers = currentData.members || [];
  const registered = currentData.registeredMembers || [];

  if(currentMembers.length === 0 && history.length === 0 && registered.length === 0){
    els.matrixCard.innerHTML = `
      <div class="empty-state-box" style="border:none;">
        <div class="empty-title">No contribution history recorded</div>
        <div class="empty-desc">Register members and record billing cycles to view member contribution compliance matrix over time.</div>
      </div>
    `;
    return;
  }

  const currInfo = getCycleDurationInfo(currentData.plan.billingDate);

  const columns = [
    { id: 'current', label: currInfo.shortLabel, dateStr: currentData.plan.billingDate || '9999-12-31' },
    ...history.slice().map(h => {
      const hInfo = getCycleDurationInfo(h.billingDate);
      return { id: h.id, label: h.cycleLabel || hInfo.shortLabel, dateStr: h.billingDate || '' };
    })
  ];

  // Sort matrix columns by descending date (newest/current billing period on left -> oldest on right)
  columns.sort((a, b) => (b.dateStr > a.dateStr ? 1 : b.dateStr < a.dateStr ? -1 : 0));

  const memberMap = new Map();
  registered.forEach(rm => memberMap.set(rm.id, { name: rm.name, active: rm.active }));
  currentMembers.forEach(m => {
    if(!memberMap.has(m.id)) memberMap.set(m.id, { name: m.name, active: true });
  });
  history.forEach(h => {
    (h.members || []).forEach(hm => {
      if(!memberMap.has(hm.id)) memberMap.set(hm.id, { name: hm.name, active: false });
    });
  });

  if(memberMap.size === 0){
    els.matrixCard.innerHTML = `
      <div class="empty-state-box" style="border:none;">
        <div class="empty-title">No members registered yet</div>
        <div class="empty-desc">Add members to your master registry to view compliance tracking across periods.</div>
      </div>
    `;
    return;
  }

  let html = `<div class="table-responsive"><table class="matrix-table"><thead><tr><th>Registered Member</th>`;
  columns.forEach(col => {
    html += `<th>${escapeHtml(col.label)}</th>`;
  });
  html += `<th>Overall Compliance</th></tr></thead><tbody>`;

  memberMap.forEach((mInfo, mId) => {
    let totalPaidCount = 0;
    let totalCyclesCount = columns.length;

    html += `<tr><td><strong>${escapeHtml(mInfo.name)}</strong> ${!mInfo.active ? '<span class="tag disabled" style="font-size:9px;padding:2px 6px;">DISABLED</span>' : ''}</td>`;

    columns.forEach(col => {
      let isPaid = false;
      let inCycle = false;
      if(col.id === 'current'){
        const cm = currentMembers.find(m => m.id === mId);
        if(cm){ inCycle = true; isPaid = cm.paid; }
      } else {
        const histCycle = history.find(h => h.id === col.id);
        if(histCycle && histCycle.members){
          const histMember = histCycle.members.find(hm => hm.id === mId);
          if(histMember){ inCycle = true; isPaid = histMember.paid; }
        }
      }
      if(isPaid) totalPaidCount++;

      let statusHtml = `—`;
      if(inCycle){
        statusHtml = `<span class="matrix-status ${isPaid ? 'ok' : 'miss'}">${isPaid ? '✓ Paid' : '✕ Pending'}</span>`;
      }

      html += `<td>${statusHtml}</td>`;
    });

    const pct = Math.round((totalPaidCount / totalCyclesCount) * 100);
    html += `<td><span class="matrix-status ok">${totalPaidCount}/${totalCyclesCount} (${pct}%)</span></td></tr>`;
  });

  html += `</tbody></table></div>`;
  els.matrixCard.innerHTML = html;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function escapeAttr(str){ return (str || "").replace(/"/g, "&quot;"); }

/* ---------------- Admin: Custom Login Modal & Token Validation ---------------- */
async function validateToken(token){
  if(!token || !token.trim()) return false;
  try {
    const res = await fetch("https://api.github.com/user", {
      headers: {
        "Authorization": `token ${token.trim()}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });
    if(res.status === 200) return true;

    // Fallback verification directly against repository Contents API
    const resRepo = await fetch(`${API_BASE}?ref=${CONFIG.branch}`, {
      headers: {
        "Authorization": `token ${token.trim()}`,
        "Accept": "application/vnd.github.v3+json"
      }
    });
    return resRepo.status === 200;
  } catch(e) {
    return false;
  }
}
/* ---------------- Custom Reusable Modal Dialog System ---------------- */
function openCustomModal({ title, bodyHtml, confirmText = "Confirm", cancelText = "Cancel", isDanger = false, showCancel = true }){
  return new Promise((resolve) => {
    const modal = document.getElementById("customModal");
    const titleEl = document.getElementById("customModalTitle");
    const bodyEl = document.getElementById("customModalBody");
    const closeBtn = document.getElementById("closeCustomModalBtn");
    const cancelBtn = document.getElementById("customModalCancelBtn");
    const confirmBtn = document.getElementById("customModalConfirmBtn");

    titleEl.textContent = title || "Notice";
    bodyEl.innerHTML = bodyHtml || "";

    confirmBtn.textContent = confirmText;
    confirmBtn.className = `small ${isDanger ? 'danger' : 'primary'}`;

    if(showCancel){
      cancelBtn.style.display = "inline-block";
      cancelBtn.textContent = cancelText;
    } else {
      cancelBtn.style.display = "none";
    }

    modal.style.display = "flex";

    const firstInput = bodyEl.querySelector("input, select, textarea");
    if(firstInput) setTimeout(() => firstInput.focus(), 100);

    function cleanup(result){
      modal.style.display = "none";
      closeBtn.removeEventListener("click", onCancel);
      cancelBtn.removeEventListener("click", onCancel);
      confirmBtn.removeEventListener("click", onConfirm);
      modal.removeEventListener("click", onOverlayClick);
      resolve(result);
    }

    function onCancel(){ cleanup(null); }
    function onConfirm(){
      const inputs = bodyEl.querySelectorAll("input, select, textarea");
      if(inputs.length > 0){
        const formData = {};
        inputs.forEach(inp => {
          const key = inp.name || inp.id || "value";
          if(inp.type === "checkbox") formData[key] = inp.checked;
          else formData[key] = inp.value;
        });
        if(inputs.length === 1 && !inputs[0].name && !inputs[0].id){
          cleanup(inputs[0].value);
          return;
        }
        if(inputs.length === 1){
          formData.value = inputs[0].value;
        }
        cleanup(formData);
      } else {
        cleanup(true);
      }
    }

    function onOverlayClick(e){
      if(e.target === modal) onCancel();
    }

    closeBtn.addEventListener("click", onCancel);
    cancelBtn.addEventListener("click", onCancel);
    confirmBtn.addEventListener("click", onConfirm);
    modal.addEventListener("click", onOverlayClick);
  });
}

  document.getElementById("newRegMemberBtn").addEventListener("click", async () => {
    const res = await openCustomModal({
      title: "Register New Member",
      bodyHtml: `
        <div class="field">
          <label for="regMemberNameInput">Full Name</label>
          <input type="text" id="regMemberNameInput" name="name" placeholder="e.g. John Doe" autocomplete="off" />

      cancelText: "Cancel"
    });

    const name = res.name.trim();

    const newId = `m-${Date.now().toString(36)}`;

      id: newId,
      name: name,
      active: true,
      joinedAt: new Date().toISOString()
    };
    if(!currentData.registeredMembers) currentData.registeredMembers = [];
    currentData.registeredMembers.push(newRegMember);

    if(res.addToCycle){
      if(!currentData.members) currentData.members = [];
      const totalCost = Number(currentData.plan.totalCost || 0);
      currentData.members.push({
        id: newId,
        name: name,
        share: 0,
        paid: false,
        paidAt: null
      });
      const n = currentData.members.length;
      if(n > 0){
        const each = Math.round((totalCost / n) * 100) / 100;
        currentData.members.forEach(m => m.share = each);

        await saveChanges(false);
        renderRegistryPanel();
        render();

    });
  });

els.addPastCycleBtn.addEventListener("click", async () => {
  const currentBDate = (currentData.plan && currentData.plan.billingDate) ? currentData.plan.billingDate : "2026-08-26";
  const defaultLabel = getCycleDurationInfo(currentBDate).label;

  const res = await openCustomModal({
    title: "Create New Billing Cycle",
    bodyHtml: `
      <div class="field">
        <label for="newCycleTypeSelect">Cycle Type & Tag</label>
        <select id="newCycleTypeSelect" name="cycleStatus">
          <option value="active">Active Cycle (Green Badge)</option>

        </select>

      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="newCycleLabelInput">Cycle Description / Label</label>
        <input type="text" id="newCycleLabelInput" name="label" value="${escapeAttr(defaultLabel)}" placeholder="e.g. Aug 27 – Sep 26 2026">
      </div>
    `,
    confirmText: "Create Cycle",
    cancelText: "Cancel"
  });

  if(!res || !res.bDate) return;

  const cycleStatus = res.cycleStatus || "active";
  const parts = res.bDate.trim().split('-');
  let yr = Number(parts[0] || 2026);
  let mo = Number(parts[1] || 8);
  const fixedBDate = `${yr}-${String(mo).padStart(2, '0')}-26`;
  const durationInfo = getCycleDurationInfo(fixedBDate);

  const customLabel = res.label && res.label.trim() ? res.label.trim() : durationInfo.label;

  const activeReg = (currentData.registeredMembers || []).filter(m => m.active);
  const n = activeReg.length || 1;
  const totalCost = Number(currentData.plan.totalCost || 649);
  const eachShare = Math.round((totalCost / n) * 100) / 100;

  const newHistEntry = {
    id: `h-${Date.now()}`,
    cycleLabel: customLabel,
    billingDate: fixedBDate,
    status: cycleStatus,
    totalCost: totalCost,
    currency: currentData.plan.currency || "₹",
    archivedAt: new Date().toISOString(),
    members: activeReg.map(rm => ({
      id: rm.id,
      name: rm.name,
      share: eachShare,
      paid: false,
      paidAt: null
    }))
  };

  if(!currentData.history) currentData.history = [];
  currentData.history.unshift(newHistEntry);

  showToast(`Creating ${cycleStatus} cycle...`, "info");
  await saveChanges(false);
  selectedCycleId = newHistEntry.id;
  populateCycleSelector();
  render();
});

function renderMemberEditList(){
  const list = document.getElementById("memberEditList");
  if(!list) return;
  list.innerHTML = "";
  if(workingMembers.length === 0){
    list.innerHTML = `<div class="empty" style="padding:16px 0;">No members in this cycle breakdown. Click <strong>+ Add Registered Member</strong> above.</div>`;
    return;
  }
  workingMembers.forEach((m, idx) => {
    const row = document.createElement("div");
    row.className = "member-edit-row";
    const dateVal = m.paidAt ? m.paidAt.split('T')[0] : '';
    row.innerHTML = `
      <div>
        <strong style="font-size:13px;display:block;">${escapeHtml(m.name)}</strong>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-dim);">${m.id}</span>
      </div>
      <input data-field="share" data-idx="${idx}" type="number" step="0.01" value="${m.share || 0}" placeholder="Amount" title="Share Amount">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);margin:0;">
        <input type="checkbox" data-field="paid" data-idx="${idx}" ${m.paid ? "checked" : ""} style="width:auto;cursor:pointer;">
        Paid
      </label>
      <input data-field="paidAt" data-idx="${idx}" type="date" value="${dateVal}" ${!m.paid ? 'disabled' : ''} title="Paid Date">
      <button class="small ghost" data-remove="${idx}">Remove</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll("input[data-field]").forEach(input => {
    input.addEventListener("input", (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      if(field === "paid"){
        workingMembers[idx].paid = e.target.checked;
        if(e.target.checked && !workingMembers[idx].paidAt){
          workingMembers[idx].paidAt = new Date().toISOString();
        } else if(!e.target.checked){
          workingMembers[idx].paidAt = null;
        }
        renderMemberEditList();
      } else if(field === "paidAt"){
        if(e.target.value){
          workingMembers[idx].paidAt = new Date(e.target.value + "T12:00:00.000Z").toISOString();
        } else {
          workingMembers[idx].paidAt = null;
        }
      } else if(field === "share"){
        workingMembers[idx].share = Number(e.target.value);
      }
    });
  });
  list.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const idx = Number(e.target.dataset.remove);
      workingMembers.splice(idx, 1);
      renderMemberEditList();
    });
  });
}

async function saveChanges(silent=false){
  const statusEl = document.getElementById("statusMsg");
  const token = getToken();
  if(!token){
    if(statusEl) statusEl.innerHTML = `<div class="status-msg err">Not logged in.</div>`;
    showToast("Not logged in", "err");
    return;
  }

  if(selectedCycleId === "current"){
    if(document.getElementById("f_name")){
      currentData.plan.name = document.getElementById("f_name").value;
      currentData.plan.currency = document.getElementById("f_currency").value;
      currentData.plan.totalCost = Number(document.getElementById("f_total").value);
      if(document.getElementById("f_status")){
        currentData.plan.status = document.getElementById("f_status").value;
      }
      const inputDate = document.getElementById("f_date").value;
      if(inputDate){
        const parts = inputDate.split('-');
        currentData.plan.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
      currentData.members = JSON.parse(JSON.stringify(workingMembers));
    }
  } else {
    const hist = currentData.history.find(h => h.id === selectedCycleId);
    if(hist && document.getElementById("f_name")){
      hist.cycleLabel = document.getElementById("f_name").value;
      hist.currency = document.getElementById("f_currency").value;
      hist.totalCost = Number(document.getElementById("f_total").value);
      if(document.getElementById("f_status")){
        hist.status = document.getElementById("f_status").value;
      }
      const inputDate = document.getElementById("f_date").value;
      if(inputDate){
        const parts = inputDate.split('-');
        hist.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
      hist.members = JSON.parse(JSON.stringify(workingMembers));
    }
  }
  
  currentData.lastUpdated = new Date().toISOString();

  if(statusEl) statusEl.innerHTML = `<div class="status-msg info">Saving to GitHub…</div>`;
  if(!silent) showToast("Saving data...", "info");

  const body = {
    message: `Update plan ledger (${new Date().toISOString()})`,
    content: b64EncodeUnicode(JSON.stringify(currentData, null, 2)),
    branch: CONFIG.branch
  };
  if(currentSha) body.sha = currentSha;

  try{
    const res = await fetch(API_BASE, {
      method:"PUT",
      headers:{
        "Accept":"application/vnd.github+json",
        "Authorization":`Bearer ${token}`,
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.message || `HTTP ${res.status}`);
    }
    const resJson = await res.json();
    currentSha = resJson.content.sha;
    
    if(statusEl) statusEl.innerHTML = `<div class="status-msg ok">Saved to GitHub successfully.</div>`;
    showToast("Saved ✓", "ok");
    populateCycleSelector();
    render();
  }catch(err){
    if(statusEl) statusEl.innerHTML = `<div class="status-msg err">Save failed — ${err.message}</div>`;
    showToast(`Save failed: ${err.message}`, "err");
  }
}

/* ---------------- Init ---------------- */
updateAdminUI();
loadData();
</script>
</body>
</html>
