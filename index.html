<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Ledger — Shared Netflix Subscription</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121110;
    --surface:#1b1917;
    --surface-2:#221f1c;
    --ink:#ede9e2;
    --ink-dim:#988f80;
    --accent:#e1362b;
    --accent-soft:rgba(225,54,43,.14);
    --gold:#d8a657;
    --gold-soft:rgba(216,166,87,.14);
    --line:#322d27;
    --radius:10px;
    --hatch-bg:#171412;
  }
  [data-theme="light"]{
    --bg:#f5f3ef;
    --surface:#ffffff;
    --surface-2:#eae6df;
    --ink:#1c1a17;
    --ink-dim:#6e6659;
    --accent:#d32f2f;
    --accent-soft:rgba(211,47,47,.1);
    --gold:#b58117;
    --gold-soft:rgba(181,129,23,.14);
    --line:#d6d0c4;
    --hatch-bg:#dbd5c9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:780px;margin:0 auto;padding:32px 20px 80px;}

  /* ---- Header / Top bar ---- */
  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    gap:10px;
    flex-wrap:wrap;
  }
  .cycle-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .cycle-picker label{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-dim);
  }
  .cycle-select{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:6px;
    outline:none;
    cursor:pointer;
  }
  .cycle-select:focus{
    border-color:var(--gold);
  }

  /* ---- Header / stub ---- */
  .stub{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px 28px 22px;
    position:relative;
    overflow:hidden;
  }
  .stub::before{
    content:"";
    position:absolute;
    left:0;right:0;bottom:0;
    height:0;
    border-top:2px dashed var(--line);
  }
  .stub-eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .stub-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    margin:6px 0 2px;
  }
  .stub-meta{
    color:var(--gold);
    font-size:13px;
    font-family:'JetBrains Mono',monospace;
    margin-top:4px;
  }
  .stub-submeta{
    color:var(--ink-dim);
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
    margin-top:2px;
  }
  .stub-total{
    margin-top:18px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .stub-total .amount{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:40px;
    color:var(--accent);
  }
  .stub-total .label{color:var(--ink-dim);font-size:13px;}

  /* ---- Split bar (signature element) ---- */
  .split-bar{
    display:flex;
    height:34px;
    border-radius:6px;
    overflow:hidden;
    margin-top:20px;
    border:1px solid var(--line);
  }
  .split-seg{
    position:relative;
    border-right:1px solid var(--bg);
    min-width:2px;
    transition:filter .15s ease;
  }
  .split-seg:last-child{border-right:none;}
  .split-seg.unpaid{
    background-image:repeating-linear-gradient(135deg, var(--surface-2), var(--surface-2) 6px, var(--hatch-bg) 6px, var(--hatch-bg) 12px);
  }
  .split-seg.paid{ background:var(--gold-soft); }
  .split-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    margin-top:12px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .split-legend span.dot{
    display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;
  }

  .archive-badge{
    display:inline-block;
    background:var(--gold-soft);
    color:var(--gold);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:3px 8px;
    border-radius:4px;
    letter-spacing:.05em;
  }

  /* ---- Section headers ---- */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:34px 0 12px;
  }
  .section-head h2{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0;
  }

  /* ---- Member ledger rows ---- */
  .ledger{
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:14px;
    align-items:center;
    padding:14px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row .name-col{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .row .name{font-weight:500;}
  .row .paid-date{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
  }
  .row .amount{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    color:var(--ink);
    text-align:right;
    min-width:70px;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    white-space:nowrap;
    border:none;
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .tag.paid{background:var(--gold-soft);color:var(--gold);}
  .tag.unpaid{background:var(--accent-soft);color:var(--accent);}
  .tag.disabled{background:var(--surface-2);color:var(--ink-dim);}
  
  .tag-btn{
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .tag-btn:hover{
    filter:brightness(1.2);
  }
  .tag-btn:active{
    transform:scale(0.96);
  }

  /* ---- Matrix table ---- */
  .matrix-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow-x:auto;
  }
  .matrix-table{
    width:100%;
    border-collapse:collapse;
    text-align:left;
    font-size:13px;
  }
  .matrix-table th, .matrix-table td{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .matrix-table th{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
    letter-spacing:.05em;
    background:var(--surface-2);
  }
  .matrix-table tr:last-child td{border-bottom:none;}
  .matrix-status{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
  }
  .matrix-status.ok{color:var(--gold);}
  .matrix-status.miss{color:var(--accent);}

  /* ---- Buttons ---- */
  button{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:13px;
    cursor:pointer;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink);
    padding:9px 14px;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{border-color:#4a4238;}
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;}
  button.primary:hover{background:#c72c22;}
  button.ghost{background:transparent;}
  button.danger{background:rgba(225,54,43,.15);border-color:var(--accent);color:var(--accent);}
  button.danger:hover{background:var(--accent);color:#fff;}
  button.small{padding:5px 10px;font-size:12px;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- Admin panel ---- */
  .admin-toggle{
    display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;flex-wrap:wrap;
  }
  .panel{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    padding:20px;
    margin-top:10px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;font-size:12px;color:var(--ink-dim);margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;letter-spacing:.03em;
  }
  .field input, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .member-edit-row{
    display:grid;
    grid-template-columns:1fr 100px 90px auto;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
  }
  .member-edit-row input, .member-edit-row select{
    background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:8px 9px;font-size:13px;width:100%;
  }

  .registry-table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
    font-size:13px;
  }
  .registry-table th, .registry-table td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    text-align:left;
  }
  .registry-table th{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-dim);
    text-transform:uppercase;
  }

  /* ---- Empty state styling ---- */
  .empty-state-box{
    text-align:center;
    padding:32px 20px;
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    margin:10px 0;
  }
  .empty-state-box .empty-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:6px;
  }
  .empty-state-box .empty-desc{
    font-size:12.5px;
    color:var(--ink-dim);
    max-width:460px;
    margin:0 auto 16px;
    line-height:1.5;
  }
  .empty-state-box .empty-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .status-toast{
    position:fixed;
    bottom:20px;
    right:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--surface-2);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:100;
    display:none;
    align-items:center;
    gap:8px;
  }
  .status-toast.ok{border-color:var(--gold);color:var(--gold);}
  .status-toast.err{border-color:var(--accent);color:var(--accent);}
  .status-toast.info{border-color:var(--ink-dim);color:var(--ink);}

  .status-msg{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 12px;
    border-radius:6px;
    margin-top:12px;
  }
  .status-msg.ok{background:var(--gold-soft);color:var(--gold);}
  .status-msg.err{background:var(--accent-soft);color:var(--accent);}
  .status-msg.info{background:var(--surface-2);color:var(--ink-dim);}

  .empty{
    text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:13px;
  }
  .footer-note{
    margin-top:40px;text-align:center;color:var(--ink-dim);font-size:11.5px;
    font-family:'JetBrains Mono',monospace;
  }
  @media (max-width:520px){
    .grid-2{grid-template-columns:1fr;}
    .member-edit-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-bar">
    <div class="cycle-picker">
      <label for="cycleSelect">Billing Period:</label>
      <select id="cycleSelect" class="cycle-select">
        <option value="current">Current Cycle</option>
      </select>
    </div>

    <div class="admin-toggle">
      <button id="themeToggleBtn" class="small ghost" title="Toggle Light/Dark Theme">☀️ Light</button>
      <button id="registryBtn" class="small ghost" style="display:none;" title="Manage Master Registered Members">Member Registry</button>
      <button id="addPastCycleBtn" class="small ghost" style="display:none;" title="Create a custom past/historical cycle">+ Past Cycle</button>
      <button id="startCycleBtn" class="small ghost" style="display:none;" title="Archive current cycle & reset for next month">Start Next Cycle</button>
      <button id="loginBtn" class="small">Admin login</button>
      <button id="logoutBtn" class="small ghost" style="display:none;">Log out</button>
    </div>
  </div>

  <div class="stub">
    <div class="stub-eyebrow">
      <span>Shared subscription · updated <span id="lastUpdated">—</span></span>
      <span id="archiveBadge" class="archive-badge" style="display:none;">ARCHIVED CYCLE</span>
    </div>
    <div class="stub-title" id="planName">Loading…</div>
    <div class="stub-meta" id="planMeta"></div>
    <div class="stub-submeta" id="planSubMeta">Prepaid Plan · Billed 26th of every month</div>
    <div class="stub-total">
      <span class="amount" id="planTotal">—</span>
      <span class="label" id="planCurrency"></span>
    </div>
    <div class="split-bar" id="splitBar"></div>
    <div class="split-legend" id="splitLegend"></div>
  </div>

  <div class="panel" id="registryPanel" style="display:none;"></div>

  <div class="section-head">
    <h2 id="ledgerTitle">Members Ledger</h2>
    <button id="editBtn" class="small" style="display:none;">Edit Cycle</button>
  </div>
  <div class="ledger" id="memberLedger">
    <div class="empty">Loading member data…</div>
  </div>

  <div class="panel" id="editPanel" style="display:none;"></div>

  <div class="section-head" style="margin-top:36px;">
    <h2>Contribution Matrix</h2>
  </div>
  <div class="matrix-card" id="matrixCard">
    <div class="empty">Loading history matrix…</div>
  </div>

  <div class="footer-note">Data lives in repo's <code>data.json</code>, managed via GitHub Contents API.</div>
</div>

<div id="toast" class="status-toast"></div>

<script>
/* ======================= CONFIG ======================= *
 * Update these three values to point at YOUR repo before  *
 * deploying to GitHub Pages. Owner/repo/path are public,   *
 * so it's fine to have them visible in this file.          *
 * ======================================================= */
const CONFIG = {
  owner: "rahulaparajit",
  repo: "netflix-split-tracker",
  path: "data.json",
  branch: "main"
};
/* ======================================================= */

const API_BASE = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
const TOKEN_KEY = "planLedger_token";

let currentData = null;
let currentSha = null;
let selectedCycleId = "current";
let isEditing = false;
let isManagingRegistry = false;
let workingMembers = [];

const els = {
  cycleSelect: document.getElementById("cycleSelect"),
  lastUpdated: document.getElementById("lastUpdated"),
  archiveBadge: document.getElementById("archiveBadge"),
  planName: document.getElementById("planName"),
  planMeta: document.getElementById("planMeta"),
  planSubMeta: document.getElementById("planSubMeta"),
  planTotal: document.getElementById("planTotal"),
  planCurrency: document.getElementById("planCurrency"),
  splitBar: document.getElementById("splitBar"),
  splitLegend: document.getElementById("splitLegend"),
  memberLedger: document.getElementById("memberLedger"),
  matrixCard: document.getElementById("matrixCard"),
  loginBtn: document.getElementById("loginBtn"),
  logoutBtn: document.getElementById("logoutBtn"),
  startCycleBtn: document.getElementById("startCycleBtn"),
  addPastCycleBtn: document.getElementById("addPastCycleBtn"),
  registryBtn: document.getElementById("registryBtn"),
  editBtn: document.getElementById("editBtn"),
  editPanel: document.getElementById("editPanel"),
  registryPanel: document.getElementById("registryPanel"),
  themeToggleBtn: document.getElementById("themeToggleBtn"),
  toast: document.getElementById("toast")
};

const SEG_COLORS = ["#e1362b","#d8a657","#7e9cd8","#7ec98f","#c98fd8","#d8c47e","#8fd8c9","#d87e9c"];
const THEME_KEY = "planLedger_theme";

function getTheme(){ return localStorage.getItem(THEME_KEY) || "dark"; }
function setTheme(t){
  localStorage.setItem(THEME_KEY, t);
  document.documentElement.setAttribute("data-theme", t);
  if(els.themeToggleBtn){
    els.themeToggleBtn.textContent = t === "light" ? "🌙 Dark" : "☀️ Light";
  }
}

// Initial theme setup
setTheme(getTheme());

if(els.themeToggleBtn){
  els.themeToggleBtn.addEventListener("click", () => {
    const current = getTheme();
    setTheme(current === "light" ? "dark" : "light");
  });
}

function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
    (match, p1) => String.fromCharCode(parseInt(p1, 16))));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split("").map(c =>
    "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
}

function fmtMoney(n, currency){
  const num = Number(n || 0);
  return `${currency || ""}${num.toLocaleString(undefined,{maximumFractionDigits:2})}`;
}

function fmtDate(isoStr){
  if(!isoStr) return "";
  try{
    const d = new Date(isoStr);
    return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  }catch(e){ return ""; }
}

function getCycleDurationInfo(billingDateStr){
  let bDate;
  if(billingDateStr){
    const parts = billingDateStr.split('-');
    if(parts.length === 3){
      bDate = new Date(Number(parts[0]), Number(parts[1]) - 1, 26);
    } else {
      bDate = new Date(billingDateStr);
      bDate.setDate(26);
    }
  } else {
    bDate = new Date();
    bDate.setDate(26);
  }

  const endDate = new Date(bDate.getFullYear(), bDate.getMonth(), 26);
  const startDate = new Date(bDate.getFullYear(), bDate.getMonth() - 1, 27);

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const startFormatted = `27th ${months[startDate.getMonth()]}`;
  const endFormatted = `26th ${months[endDate.getMonth()]} ${endDate.getFullYear()}`;
  const shortRange = `${months[startDate.getMonth()]} 27 – ${months[endDate.getMonth()]} 26`;

  return {
    billingDateIso: endDate.toISOString().split("T")[0],
    startDate,
    endDate,
    label: `${startFormatted} – ${endFormatted}`,
    shortLabel: shortRange
  };
}

function showToast(msg, type="info", duration=3000){
  els.toast.className = `status-toast ${type}`;
  els.toast.textContent = msg;
  els.toast.style.display = "flex";
  if(duration > 0){
    setTimeout(() => {
      els.toast.style.display = "none";
    }, duration);
  }
}

async function loadData(){
  els.memberLedger.innerHTML = `<div class="empty">Loading member data…</div>`;
  try{
    const headers = {"Accept":"application/vnd.github+json"};
    const token = getToken();
    if(token) headers["Authorization"] = `Bearer ${token}`;
    const res = await fetch(`${API_BASE}?ref=${CONFIG.branch}&_=${Date.now()}`, {headers});
    if(!res.ok){
      if(res.status === 404){
        renderEmptyState();
        return;
      }
      throw new Error(`GitHub API error: ${res.status}`);
    }
    const json = await res.json();
    currentSha = json.sha;
    currentData = JSON.parse(b64DecodeUnicode(json.content.replace(/\n/g,"")));
    
    if(!currentData.members) currentData.members = [];
    if(!currentData.history) currentData.history = [];
    if(!currentData.registeredMembers) currentData.registeredMembers = [];
    
    // Auto-sync initial registered members if missing
    if(currentData.registeredMembers.length === 0 && currentData.members.length > 0){
      currentData.registeredMembers = currentData.members.map(m => ({
        id: m.id || ('m-' + Date.now() + Math.random().toString(36).substring(2,5)),
        name: m.name,
        active: true,
        joinedAt: new Date().toISOString()
      }));
    }
    
    if(currentData.plan && currentData.plan.billingDate){
      const parts = currentData.plan.billingDate.split('-');
      if(parts.length === 3 && parts[2] !== '26'){
        currentData.plan.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
    }
    
    populateCycleSelector();
    render();
  }catch(err){
    els.memberLedger.innerHTML = `<div class="empty">Couldn't load data.json — ${err.message}</div>`;
  }
}

function renderEmptyState(){
  currentData = {
    plan:{name:"Netflix Premium", totalCost:649, currency:"₹", billingDate:"2026-08-26", notes:"Prepaid plan · Billed on 26th of every month"},
    registeredMembers:[],
    members:[],
    history:[],
    lastUpdated:null
  };
  currentSha = null;
  populateCycleSelector();
  render();
}

function populateCycleSelector(){
  els.cycleSelect.innerHTML = "";

  const currInfo = getCycleDurationInfo(currentData.plan.billingDate);
  const currOpt = document.createElement("option");
  currOpt.value = "current";
  currOpt.textContent = `Current Cycle (${currInfo.label})`;
  els.cycleSelect.appendChild(currOpt);

  if(currentData && currentData.history){
    currentData.history.forEach(h => {
      const opt = document.createElement("option");
      opt.value = h.id;
      const hInfo = getCycleDurationInfo(h.billingDate);
      opt.textContent = `${h.cycleLabel || hInfo.label} (Archived)`;
      els.cycleSelect.appendChild(opt);
    });
  }
  els.cycleSelect.value = selectedCycleId;
}

els.cycleSelect.addEventListener("change", (e) => {
  selectedCycleId = e.target.value;
  if(isEditing){
    isEditing = false;
    els.editPanel.style.display = "none";
    els.editBtn.textContent = "Edit Cycle";
  }
  updateAdminUI();
  render();
});

function getActiveCycleData(){
  if(!currentData) return { plan:{}, members:[] };
  if(selectedCycleId === "current"){
    return {
      plan: currentData.plan,
      members: currentData.members || [],
      isArchive: false
    };
  }
  const hist = (currentData.history || []).find(h => h.id === selectedCycleId);
  if(hist){
    return {
      plan: {
        name: currentData.plan.name,
        totalCost: hist.totalCost || currentData.plan.totalCost,
        currency: hist.currency || currentData.plan.currency,
        billingDate: hist.billingDate,
        notes: currentData.plan.notes
      },
      members: hist.members || [],
      isArchive: true,
      cycleLabel: hist.cycleLabel,
      histObject: hist
    };
  }
  return { plan: currentData.plan, members: currentData.members || [], isArchive: false };
}

function render(){
  const cycleData = getActiveCycleData();
  const {plan, members, isArchive, cycleLabel} = cycleData;

  const durationInfo = getCycleDurationInfo(plan.billingDate);

  els.planName.textContent = plan.name || "Untitled plan";
  els.planMeta.textContent = `Cycle Duration · ${cycleLabel || durationInfo.label}`;
  els.planSubMeta.textContent = `Prepaid Plan · Billed on 26th (${durationInfo.billingDateIso})`;
  els.planTotal.textContent = fmtMoney(plan.totalCost, plan.currency);
  els.planCurrency.textContent = "total / cycle";
  els.lastUpdated.textContent = currentData.lastUpdated ? new Date(currentData.lastUpdated).toLocaleDateString() : "never";

  els.archiveBadge.style.display = isArchive ? "inline-block" : "none";
  if(isArchive){
    els.archiveBadge.textContent = `ARCHIVED · ${cycleLabel || durationInfo.shortLabel}`;
  }

  renderSplitBar(plan, members);
  renderLedger(members, plan.currency, isArchive);
  renderMatrix();

  if(isEditing) renderEditPanel();
  if(isManagingRegistry) renderRegistryPanel();
}

function renderSplitBar(plan, members){
  els.splitBar.innerHTML = "";
  els.splitLegend.innerHTML = "";
  
  if(!members || members.length === 0){
    els.splitBar.style.display = "none";
    els.splitLegend.innerHTML = `<span style="color:var(--ink-dim);font-style:italic;">No members in cycle — split bar hidden</span>`;
    return;
  }

  const total = members.reduce((s,m) => s + Number(m.share || 0), 0) || 1;
  members.forEach((m, i) => {
    const pct = (Number(m.share || 0) / total) * 100;
    const color = SEG_COLORS[i % SEG_COLORS.length];
    const seg = document.createElement("div");
    seg.className = `split-seg ${m.paid ? "paid" : "unpaid"}`;
    seg.style.width = `${pct}%`;
    if(m.paid) seg.style.background = color;
    seg.title = `${m.name}: ${fmtMoney(m.share, plan.currency)} (${m.paid ? "paid" : "unpaid"})`;
    els.splitBar.appendChild(seg);

    const legendItem = document.createElement("div");
    legendItem.innerHTML = `<span class="dot" style="background:${m.paid ? color : 'transparent'};border:1px solid ${color};"></span>${m.name} · ${fmtMoney(m.share, plan.currency)}`;
    els.splitLegend.appendChild(legendItem);
  });
  els.splitBar.style.display = "flex";
}

function renderLedger(members, currency, isArchive){
  const loggedIn = !!getToken();
  
  if(!members || members.length === 0){
    let emptyActionHtml = '';
    if(loggedIn){
      emptyActionHtml = `
        <div class="empty-actions">
          <button id="ledgerEmptyRegBtn" class="primary small">Open Member Registry</button>
          <button id="ledgerEmptyEditBtn" class="ghost small">Edit Cycle Members</button>
        </div>
      `;
    }
    
    els.memberLedger.innerHTML = `
      <div class="empty-state-box">
        <div class="empty-title">No members in this cycle</div>
        <div class="empty-desc">
          ${loggedIn 
            ? "There are no members assigned to this billing period yet. Register new members or add registered members to start tracking." 
            : "The administrator has not added any members to this cycle yet."}
        </div>
        ${emptyActionHtml}
      </div>
    `;

    if(loggedIn){
      const regBtn = document.getElementById("ledgerEmptyRegBtn");
      const editBtn = document.getElementById("ledgerEmptyEditBtn");
      if(regBtn){
        regBtn.addEventListener("click", () => {
          isManagingRegistry = true;
          els.registryPanel.style.display = "block";
          els.registryBtn.textContent = "Close Registry";
          renderRegistryPanel();
        });
      }
      if(editBtn){
        editBtn.addEventListener("click", () => {
          isEditing = true;
          els.editPanel.style.display = "block";
          els.editBtn.textContent = "Close Editor";
          renderEditPanel();
        });
      }
    }
    return;
  }

  els.memberLedger.innerHTML = "";
  
  members.forEach(m => {
    const row = document.createElement("div");
    row.className = "row";
    
    const paidAtText = m.paid && m.paidAt ? `Paid ${fmtDate(m.paidAt)}` : '';
    
    let tagHtml = `<span class="tag ${m.paid ? "paid" : "unpaid"}">${m.paid ? "Paid ✓" : "Unpaid"}</span>`;
    
    if(loggedIn){
      tagHtml = `<button class="tag tag-btn ${m.paid ? "paid" : "unpaid"}" data-toggle-id="${m.id}">
        ${m.paid ? "Paid ✓" : "Mark Paid"}
      </button>`;
    }

    row.innerHTML = `
      <div class="name-col">
        <div class="name">${escapeHtml(m.name)}</div>
        ${paidAtText ? `<div class="paid-date">${paidAtText}</div>` : ''}
      </div>
      <div class="amount">${fmtMoney(m.share, currency)}</div>
      <div>${tagHtml}</div>
    `;
    els.memberLedger.appendChild(row);
  });

  if(loggedIn){
    els.memberLedger.querySelectorAll("[data-toggle-id]").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const id = e.currentTarget.dataset.toggleId;
        let targetMembers = isArchive ? getActiveCycleData().members : currentData.members;
        const targetMember = targetMembers.find(m => m.id === id);
        if(targetMember){
          targetMember.paid = !targetMember.paid;
          targetMember.paidAt = targetMember.paid ? new Date().toISOString() : null;
          render();
          showToast("Saving status...", "info");
          await saveChanges(true);
        }
      });
    });
  }
}

function renderMatrix(){
  if(!currentData) return;
  const history = currentData.history || [];
  const currentMembers = currentData.members || [];
  const registered = currentData.registeredMembers || [];

  if(currentMembers.length === 0 && history.length === 0 && registered.length === 0){
    els.matrixCard.innerHTML = `
      <div class="empty-state-box" style="border:none;">
        <div class="empty-title">No contribution history recorded</div>
        <div class="empty-desc">Register members and record billing cycles to view member contribution compliance matrix over time.</div>
      </div>
    `;
    return;
  }

  const currInfo = getCycleDurationInfo(currentData.plan.billingDate);

  const columns = [
    { id: 'current', label: currInfo.shortLabel },
    ...history.slice().map(h => {
      const hInfo = getCycleDurationInfo(h.billingDate);
      return { id: h.id, label: h.cycleLabel || hInfo.shortLabel };
    })
  ];

  const memberMap = new Map();
  registered.forEach(rm => memberMap.set(rm.id, { name: rm.name, active: rm.active }));
  currentMembers.forEach(m => {
    if(!memberMap.has(m.id)) memberMap.set(m.id, { name: m.name, active: true });
  });
  history.forEach(h => {
    (h.members || []).forEach(hm => {
      if(!memberMap.has(hm.id)) memberMap.set(hm.id, { name: hm.name, active: false });
    });
  });

  if(memberMap.size === 0){
    els.matrixCard.innerHTML = `
      <div class="empty-state-box" style="border:none;">
        <div class="empty-title">No members registered yet</div>
        <div class="empty-desc">Add members to your master registry to view compliance tracking across periods.</div>
      </div>
    `;
    return;
  }

  let html = `<table class="matrix-table"><thead><tr><th>Registered Member</th>`;
  columns.forEach(col => {
    html += `<th>${escapeHtml(col.label)}</th>`;
  });
  html += `<th>Overall Compliance</th></tr></thead><tbody>`;

  memberMap.forEach((mInfo, mId) => {
    let totalPaidCount = 0;
    let totalCyclesCount = columns.length;

    html += `<tr><td><strong>${escapeHtml(mInfo.name)}</strong> ${!mInfo.active ? '<span class="tag disabled" style="font-size:9px;padding:2px 6px;">DISABLED</span>' : ''}</td>`;

    columns.forEach(col => {
      let isPaid = false;
      let inCycle = false;
      if(col.id === 'current'){
        const cm = currentMembers.find(m => m.id === mId);
        if(cm){ inCycle = true; isPaid = cm.paid; }
      } else {
        const histCycle = history.find(h => h.id === col.id);
        if(histCycle && histCycle.members){
          const histMember = histCycle.members.find(hm => hm.id === mId);
          if(histMember){ inCycle = true; isPaid = histMember.paid; }
        }
      }
      if(isPaid) totalPaidCount++;

      let statusHtml = `—`;
      if(inCycle){
        statusHtml = `<span class="matrix-status ${isPaid ? 'ok' : 'miss'}">${isPaid ? '✓ Paid' : '✕ Pending'}</span>`;
      }

      html += `<td>${statusHtml}</td>`;
    });

    const pct = Math.round((totalPaidCount / totalCyclesCount) * 100);
    html += `<td><span class="matrix-status ok">${totalPaidCount}/${totalCyclesCount} (${pct}%)</span></td></tr>`;
  });

  html += `</tbody></table>`;
  els.matrixCard.innerHTML = html;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str || "";
  return d.innerHTML;
}
function escapeAttr(str){ return (str || "").replace(/"/g, "&quot;"); }

function renderRegistryPanel(){
  const registered = currentData.registeredMembers || [];
  els.registryPanel.innerHTML = `
    <div class="section-head" style="margin-top:0;">
      <h2>Master Member Registry</h2>
      <button id="newRegMemberBtn" class="small primary">+ Register New Member</button>
    </div>
    <div style="font-size:12px;color:var(--ink-dim);margin-bottom:12px;">
      Registered members retain the same persistent ID across all billing cycles. Disabling a member excludes them from future auto-populated cycles while preserving history.
    </div>

    ${registered.length === 0 ? `
      <div class="empty-state-box">
        <div class="empty-title">No registered members yet</div>
        <div class="empty-desc">Click <strong>+ Register New Member</strong> above to add your first persistent member.</div>
      </div>
    ` : `
      <table class="registry-table">
        <thead>
          <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${registered.map(m => `
            <tr>
              <td><code>${m.id}</code></td>
              <td><strong>${escapeHtml(m.name)}</strong></td>
              <td>
                <span class="tag ${m.active ? 'paid' : 'disabled'}">${m.active ? 'Active' : 'Disabled'}</span>
              </td>
              <td style="display:flex;gap:6px;">
                <button class="small ghost" data-toggle-reg-id="${m.id}">
                  ${m.active ? 'Disable' : 'Enable'}
                </button>
                <button class="small danger" data-delete-reg-id="${m.id}">
                  Delete
                </button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `}
  `;

  document.getElementById("newRegMemberBtn").addEventListener("click", async () => {
    const name = prompt("Enter new member full name:");
    if(!name || !name.trim()) return;

    const newId = `m-${Date.now().toString(36)}`;
    const newRegMember = {
      id: newId,
      name: name.trim(),
      active: true,
      joinedAt: new Date().toISOString()
    };
    if(!currentData.registeredMembers) currentData.registeredMembers = [];
    currentData.registeredMembers.push(newRegMember);

    if(confirm(`Also add ${name.trim()} to the current active billing cycle?`)){
      if(!currentData.members) currentData.members = [];
      const totalCost = Number(currentData.plan.totalCost || 0);
      currentData.members.push({
        id: newId,
        name: name.trim(),
        share: 0,
        paid: false,
        paidAt: null
      });
      const n = currentData.members.length;
      if(n > 0){
        const each = Math.round((totalCost / n) * 100) / 100;
        currentData.members.forEach(m => m.share = each);
      }
    }

    showToast("Registering member...", "info");
    await saveChanges(false);
    renderRegistryPanel();
    render();
  });

  els.registryPanel.querySelectorAll("[data-toggle-reg-id]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const regId = e.currentTarget.dataset.toggleRegId;
      const target = currentData.registeredMembers.find(m => m.id === regId);
      if(target){
        target.active = !target.active;
        showToast("Updating member status...", "info");
        await saveChanges(false);
        renderRegistryPanel();
        render();
      }
    });
  });

  els.registryPanel.querySelectorAll("[data-delete-reg-id]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      const regId = e.currentTarget.dataset.deleteRegId;
      const target = currentData.registeredMembers.find(m => m.id === regId);
      if(target){
        if(!confirm(`Permanently delete member "${target.name}"?\n\nThis will remove them from the master registry and current cycle.`)) return;

        currentData.registeredMembers = currentData.registeredMembers.filter(m => m.id !== regId);
        currentData.members = (currentData.members || []).filter(m => m.id !== regId);

        const totalCost = Number(currentData.plan.totalCost || 0);
        const n = currentData.members.length;
        if(n > 0){
          const each = Math.round((totalCost / n) * 100) / 100;
          currentData.members.forEach(m => m.share = each);
        }

        showToast("Deleting member...", "info");
        await saveChanges(false);
        renderRegistryPanel();
        render();
      }
    });
  });
}

/* ---------------- Admin: Start Next Cycle ---------------- */
els.startCycleBtn.addEventListener("click", async () => {
  if(!confirm("Start next billing cycle?\n\nThis will archive current contributions to History and reset member payment statuses for active registered members.")) return;

  const currentDuration = getCycleDurationInfo(currentData.plan.billingDate);
  
  const historyEntry = {
    id: `h-${Date.now()}`,
    cycleLabel: currentDuration.label,
    billingDate: currentData.plan.billingDate,
    totalCost: currentData.plan.totalCost,
    currency: currentData.plan.currency,
    archivedAt: new Date().toISOString(),
    members: JSON.parse(JSON.stringify(currentData.members || []))
  };

  if(!currentData.history) currentData.history = [];
  currentData.history.unshift(historyEntry);

  const activeReg = (currentData.registeredMembers || []).filter(m => m.active);
  const n = activeReg.length || 1;
  const eachShare = Math.round((Number(currentData.plan.totalCost || 0) / n) * 100) / 100;

  currentData.members = activeReg.map(rm => ({
    id: rm.id,
    name: rm.name,
    share: eachShare,
    paid: false,
    paidAt: null
  }));

  const parts = (currentData.plan.billingDate || "2026-08-26").split('-');
  let yr = Number(parts[0]);
  let mo = Number(parts[1]);
  mo++;
  if(mo > 12){
    mo = 1;
    yr++;
  }
  const nextMoStr = String(mo).padStart(2, '0');
  currentData.plan.billingDate = `${yr}-${nextMoStr}-26`;

  showToast("Archiving cycle & resetting...", "info");
  await saveChanges(false);
  populateCycleSelector();
  render();
});

/* ---------------- Admin: Create Custom Past Cycle ---------------- */
els.addPastCycleBtn.addEventListener("click", async () => {
  const bDateInput = prompt("Enter billing date for this cycle (YYYY-MM-26):", "2026-07-26");
  if(!bDateInput) return;

  const parts = bDateInput.trim().split('-');
  let yr = Number(parts[0] || 2026);
  let mo = Number(parts[1] || 7);
  const fixedBDate = `${yr}-${String(mo).padStart(2, '0')}-26`;
  const durationInfo = getCycleDurationInfo(fixedBDate);

  const customLabel = prompt("Enter cycle label/duration:", durationInfo.label) || durationInfo.label;

  const activeReg = (currentData.registeredMembers || []).filter(m => m.active);
  const n = activeReg.length || 1;
  const eachShare = Math.round((Number(currentData.plan.totalCost || 649) / n) * 100) / 100;

  const newHistEntry = {
    id: `h-${Date.now()}`,
    cycleLabel: customLabel,
    billingDate: fixedBDate,
    totalCost: currentData.plan.totalCost || 649,
    currency: currentData.plan.currency || "₹",
    archivedAt: new Date().toISOString(),
    members: activeReg.map(rm => ({
      id: rm.id,
      name: rm.name,
      share: eachShare,
      paid: false,
      paidAt: null
    }))
  };

  if(!currentData.history) currentData.history = [];
  currentData.history.unshift(newHistEntry);

  showToast("Adding custom cycle...", "info");
  await saveChanges(false);
  selectedCycleId = newHistEntry.id;
  populateCycleSelector();
  render();
});

function renderEditPanel(){
  const activeData = getActiveCycleData();
  const {plan, members, isArchive, cycleLabel} = activeData;
  workingMembers = JSON.parse(JSON.stringify(members || []));

  let deleteBtnHtml = isArchive ? `<button id="deleteCycleBtn" class="danger small">Delete Cycle</button>` : '';

  els.editPanel.innerHTML = `
    <div class="grid-2">
      <div class="field">
        <label>${isArchive ? 'Cycle Label / Range' : 'Plan Name'}</label>
        <input id="f_name" value="${escapeAttr(isArchive ? (cycleLabel || plan.name) : plan.name)}">
      </div>
      <div class="field">
        <label>Currency Symbol</label>
        <input id="f_currency" value="${escapeAttr(plan.currency)}">
      </div>
      <div class="field">
        <label>Total Cost / Cycle</label>
        <input id="f_total" type="number" step="0.01" value="${plan.totalCost || 0}">
      </div>
      <div class="field">
        <label>Billing Date (26th of month)</label>
        <input id="f_date" type="date" value="${plan.billingDate || ""}">
      </div>
    </div>

    <div class="section-head" style="margin-top:6px;">
      <h2>Cycle Members Breakdown</h2>
      <button id="addRegisteredMemberToCycleBtn" class="small ghost">+ Add Registered Member</button>
    </div>
    <div id="memberEditList"></div>

    <div style="display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;">
      <button id="splitEvenlyBtn" class="ghost small">Split evenly</button>
      ${deleteBtnHtml}
      <button id="saveBtn" class="primary" style="margin-left:auto;">Save Changes</button>
    </div>
    <div id="statusMsg"></div>
  `;
  renderMemberEditList();

  document.getElementById("addRegisteredMemberToCycleBtn").addEventListener("click", () => {
    const registered = currentData.registeredMembers || [];
    const available = registered.filter(rm => !workingMembers.some(wm => wm.id === rm.id));

    if(available.length === 0){
      alert("All registered members are already included in this cycle, or no new registered members exist. Go to 'Member Registry' to register a new member.");
      return;
    }

    const optionsText = available.map((m, i) => `${i + 1}. ${m.name} (${m.id})`).join('\n');
    const choice = prompt(`Select registered member to add:\n\n${optionsText}\n\nEnter number (1-${available.length}):`);
    const idx = Number(choice) - 1;
    if(idx >= 0 && idx < available.length){
      const selected = available[idx];
      workingMembers.push({
        id: selected.id,
        name: selected.name,
        share: 0,
        paid: false,
        paidAt: null
      });
      renderMemberEditList();
    }
  });

  document.getElementById("splitEvenlyBtn").addEventListener("click", () => {
    const n = workingMembers.length;
    if(n === 0) return;
    const totalCost = Number(document.getElementById("f_total").value || 0);
    const each = Math.round((totalCost / n) * 100) / 100;
    workingMembers.forEach(m => m.share = each);
    renderMemberEditList();
  });

  if(isArchive && document.getElementById("deleteCycleBtn")){
    document.getElementById("deleteCycleBtn").addEventListener("click", async () => {
      if(!confirm("Are you sure you want to delete this archived cycle?")) return;
      currentData.history = currentData.history.filter(h => h.id !== selectedCycleId);
      selectedCycleId = "current";
      isEditing = false;
      els.editPanel.style.display = "none";
      showToast("Deleting cycle...", "info");
      await saveChanges(false);
      populateCycleSelector();
      render();
    });
  }

  document.getElementById("saveBtn").addEventListener("click", () => saveChanges(false));
}

function renderMemberEditList(){
  const list = document.getElementById("memberEditList");
  if(!list) return;
  list.innerHTML = "";
  if(workingMembers.length === 0){
    list.innerHTML = `<div class="empty" style="padding:16px 0;">No members in this cycle breakdown. Click <strong>+ Add Registered Member</strong> above.</div>`;
    return;
  }
  workingMembers.forEach((m, idx) => {
    const row = document.createElement("div");
    row.className = "member-edit-row";
    row.innerHTML = `
      <div>
        <strong style="font-size:13px;display:block;">${escapeHtml(m.name)}</strong>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-dim);">${m.id}</span>
      </div>
      <input data-field="share" data-idx="${idx}" type="number" step="0.01" value="${m.share || 0}" placeholder="Amount">
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);">
        <input type="checkbox" data-field="paid" data-idx="${idx}" ${m.paid ? "checked" : ""} style="width:auto;">
        Paid
      </label>
      <button class="small ghost" data-remove="${idx}">Remove</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll("input[data-field]").forEach(input => {
    input.addEventListener("input", (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      if(field === "paid"){
        workingMembers[idx].paid = e.target.checked;
        workingMembers[idx].paidAt = e.target.checked ? (workingMembers[idx].paidAt || new Date().toISOString()) : null;
      } else if(field === "share"){
        workingMembers[idx].share = Number(e.target.value);
      }
    });
  });
  list.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const idx = Number(e.target.dataset.remove);
      workingMembers.splice(idx, 1);
      renderMemberEditList();
    });
  });
}

async function saveChanges(silent=false){
  const statusEl = document.getElementById("statusMsg");
  const token = getToken();
  if(!token){
    if(statusEl) statusEl.innerHTML = `<div class="status-msg err">Not logged in.</div>`;
    showToast("Not logged in", "err");
    return;
  }

  if(selectedCycleId === "current"){
    if(document.getElementById("f_name")){
      currentData.plan.name = document.getElementById("f_name").value;
      currentData.plan.currency = document.getElementById("f_currency").value;
      currentData.plan.totalCost = Number(document.getElementById("f_total").value);
      const inputDate = document.getElementById("f_date").value;
      if(inputDate){
        const parts = inputDate.split('-');
        currentData.plan.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
      currentData.members = JSON.parse(JSON.stringify(workingMembers));
    }
  } else {
    const hist = currentData.history.find(h => h.id === selectedCycleId);
    if(hist && document.getElementById("f_name")){
      hist.cycleLabel = document.getElementById("f_name").value;
      hist.currency = document.getElementById("f_currency").value;
      hist.totalCost = Number(document.getElementById("f_total").value);
      const inputDate = document.getElementById("f_date").value;
      if(inputDate){
        const parts = inputDate.split('-');
        hist.billingDate = `${parts[0]}-${parts[1]}-26`;
      }
      hist.members = JSON.parse(JSON.stringify(workingMembers));
    }
  }
  
  currentData.lastUpdated = new Date().toISOString();

  if(statusEl) statusEl.innerHTML = `<div class="status-msg info">Saving to GitHub…</div>`;
  if(!silent) showToast("Saving data...", "info");

  const body = {
    message: `Update plan ledger (${new Date().toISOString()})`,
    content: b64EncodeUnicode(JSON.stringify(currentData, null, 2)),
    branch: CONFIG.branch
  };
  if(currentSha) body.sha = currentSha;

  try{
    const res = await fetch(API_BASE, {
      method:"PUT",
      headers:{
        "Accept":"application/vnd.github+json",
        "Authorization":`Bearer ${token}`,
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.message || `HTTP ${res.status}`);
    }
    const resJson = await res.json();
    currentSha = resJson.content.sha;
    
    if(statusEl) statusEl.innerHTML = `<div class="status-msg ok">Saved to GitHub successfully.</div>`;
    showToast("Saved ✓", "ok");
    populateCycleSelector();
    render();
  }catch(err){
    if(statusEl) statusEl.innerHTML = `<div class="status-msg err">Save failed — ${err.message}</div>`;
    showToast(`Save failed: ${err.message}`, "err");
  }
}

/* ---------------- Init ---------------- */
updateAdminUI();
loadData();
</script>
